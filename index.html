<!DOCTYPE html>
<html lang="uz">
  <head>
    <link rel="manifest" href="/manifest.json" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />




    <title>Anitoku | Tensura</title>
    <!-- Include Inter font from Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"
      integrity="sha512-fD9DI5bZwQxOi7MhYWnnNPlvXdp/2Pj3XSTRrFs5FQa4mizyGLnJcN6tuvUS6LbmgN1ut+XGSABKvjN0H6Aoow=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.378/pdf.min.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Burger icon -->
    <div class="burger" id="burger">
      <i class="fa-solid fa-bars"></i>
    </div>

    <!-- PDF tools -->
    <div class="pdf_tools" id="pdf_tools">
      <i class="fa-solid fa-ellipsis" id="ellipsisIcon"></i>
    </div>

    <div class="pdf_tools_menu" id="pdf_tools_menu">
      <div class="pdf_option_wrapper">
        <label>Fullscreen <input type="checkbox" id="fullscreenCheck" /></label>
      </div>
    </div>

    <div class="container">
      <!-- Sidebar -->
      <nav class="sidebar" id="sidebar">
        <hr />
        <ul></ul>
      </nav>

      <!-- Main content -->
      <main class="main" id="main">
        <div id="title-pdf-name"></div>
        <div id="pdf-content">Loading . . .</div>
      </main>
    </div>
  </body>
  <script src="about.pdf.js"></script>
  <script src="main.js"></script>
</html>
